name: Agent draft PR build

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    if: startsWith(github.head_ref, 'agent/issue-')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
